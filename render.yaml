# Render blueprint for the API (free web service). Create it from the dashboard
# with "New > Blueprint" and fill in the env vars marked `sync: false`.
services:
  - type: web
    name: workgrid-api
    runtime: node
    plan: free
    region: singapore # next to the Atlas cluster
    # Render's system folders are read-only, so `corepack enable` fails; run pnpm via npx.
    # NODE_ENV=development keeps devDependencies (tsup) installed for the build.
    buildCommand: NODE_ENV=development npx --yes pnpm@12.3.4 install --frozen-lockfile && npx --yes pnpm@12.3.4 --filter @workgrid/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # MongoDB Atlas free cluster connection string
      - key: CLIENT_URL
        sync: false # e.g. https://workgrid.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
